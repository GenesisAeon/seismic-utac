site_name: seismic-utac
site_description: >-
  Package 23 — Earthquake Seismicity & Gutenberg-Richter SOC.
  UTAC/CREP model of global earthquake seismicity (GenesisAeon).
site_author: GenesisAeon · MOR Research Collective
repo_url: https://github.com/GenesisAeon/seismic-utac
repo_name: GenesisAeon/seismic-utac

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.annotate
    - content.code.copy
    - search.highlight

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - CLI Reference: cli.md
  - Templates: templates.md
