[project]
name = "seismic-utac"
version = "1.0.0"
description = "Package 23: Earthquake Seismicity & Gutenberg-Richter SOC - UTAC/CREP model (GenesisAeon)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Johann Römer", email = "joberoemer@gmail.com" }]
maintainers = [{ name = "GenesisAeon", email = "joberoemer@gmail.com" }]
requires-python = ">=3.10"
keywords = [
    "seismicity", "Gutenberg-Richter", "SOC", "self-organized-criticality",
    "CREP", "UTAC", "b-value", "Omori-Utsu", "earthquake", "geophysics",
    "entropy", "GenesisAeon",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "numpy>=1.26",
    "scipy>=1.13",
    "diamond-setup>=2.2.0",
]

[project.optional-dependencies]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
]
dev = [
    "ruff>=0.6.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "types-PyYAML>=6.0",
]

[project.scripts]
diamond = "diamond_setup.cli:app"
seismic-utac = "seismic_utac.cli:app"

[project.urls]
Homepage = "https://github.com/GenesisAeon/seismic-utac"
Repository = "https://github.com/GenesisAeon/seismic-utac"
Documentation = "https://genesisaeon.github.io/seismic-utac"
Issues = "https://github.com/GenesisAeon/seismic-utac/issues"
Zenodo = "https://doi.org/10.5281/zenodo.XXXXXXX"
"Bak & Tang (1989)" = "https://doi.org/10.1029/JB094iB11p15635"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seismic_utac"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "W", "UP", "C4", "SIM"]
ignore = ["B008"]  # typer uses function calls in defaults

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # allow assert in tests

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
# Typer decorators are not fully typed upstream; suppress the decorator error
disable_error_code = ["untyped-decorator", "import-untyped"]

[dependency-groups]
dev = [
    "pytest-cov>=7.0.0",
    "types-pyyaml>=6.0.12.20260518",
]

